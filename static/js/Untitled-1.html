<div class="two"><section class="panel"><h2>Spielregeln</h2><div class="field"><label>Spielmodus</label><select id="mode" onchange="updateMode()"><option value="x01">x01</option><option value="cricket">Cricket</option></select></div><div id="rules"><div class="field"><label>Startpunktzahl</label><select id="start">${[301, 501, 701, 901, 1001].map((x) => `<option ${x === 501 ? "selected" : ""}>${x}</option>`).join("")}</select></div><div class="field"><label>Check-In (Spielbeginn)</label><select id="checkin"><option value="straight">Straight In</option><option value="double">Double In</option><option value="master">Master In</option></select></div><div class="field"><label>Checkout</label><select id="out"><option value="double">Double Out</option><option value="single">Single Out</option><option value="master">Master Out</option></select></div></div></section><section class="panel"><h2>Teilnehmer wählen <span class="mini" id="count">(${model.selected.length} ausgewählt)</span></h2>${model.state.players.length ? `<label class="choice select-all"><input id="select-all-players" type="checkbox" onchange="toggleAllPlayers(this.checked)" ${model.selected.length === model.state.players.length ? "checked" : ""}>Alle auswählen</label>` : ""}${model.state.players.length ? model.state.players.map((p, i) => `<label class="choice"><input type="checkbox" value="${p.id}" onchange="togglePlayer('${p.id}',this.checked)" ${model.selected.includes(p.id) ? "checked" : ""}><span class="player-number">${i + 1}.</span> ${avatar(p)} ${esc(p.name)}</label>).join("") : '<p class="muted">Lege zuerst mindestens zwei Spieler an.</p>'}<div class="sectionline"></div><button class="primary" onclick="startGame()">Spiel starten →</button></section></div>
